<svg width="1024" height="1024" viewBox="0 0 56 56"
  fill="none" xmlns="http://www.w3.org/2000/svg">

  <!-- app icon background -->
  <rect width="56" height="56" rx="12" fill="#0d0d0d"/>

  <!-- wallet body -->
  <path d="M10 20h36v24a4 4 0 0 1-4 4H14a4 4 0 0 1-4-4V20z"
    fill="#1a2a22" stroke="#00C8A8" stroke-width="1.6"/>

  <!-- wallet flap / top fold -->
  <path d="M10 20v-3a4 4 0 0 1 4-4h28a4 4 0 0 1 4 4v3"
    fill="#1a2a22" stroke="#00C8A8" stroke-width="1.6"/>

  <!-- coin pocket -->
  <rect x="32" y="27" width="14" height="9" rx="4.5"
    fill="#111" stroke="#00C8A8" stroke-width="1.3"/>
  <circle cx="39" cy="31.5" r="2.5" fill="#00C8A8"/>

  <!-- water drop = the leak -->
  <path d="M28 10c0 0-5 5-5 9a5 5 0 0 0 10 0c0-4-5-9-5-9z"
    fill="#00c8ff"/>

  <!-- cross on drop = sealed -->
  <path d="M25.5 21.5l2.5-2.5 2.5 2.5"
    stroke="#0d0d0d" stroke-width="1.5"
    stroke-linecap="round" stroke-linejoin="round"/>

</svg>
