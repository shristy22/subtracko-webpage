<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SubTracko Password Reset</title>
    <meta
      name="description"
      content="Reset your SubTracko account password."
    />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="page-shell">
        <div class="topbar-inner">
          <a class="brand" href="./index.html" aria-label="SubTracko home">
            <img class="brand-mark" src="./assets/brand/subtracko-mark.svg" alt="" aria-hidden="true" />
            <span class="brand-text">SUB<span>TRACKO</span></span>
          </a>
          <nav class="topnav">
            <a href="./index.html">Home</a>
            <a href="./privacy.html">Privacy</a>
          </nav>
        </div>
      </div>
    </header>

    <div class="page-shell">
      <main class="privacy-page reset-page">
        <section class="reset-hero reveal">
          <div class="reset-hero-copy">
            <h1>Reset a new SubTracko password.</h1>
          </div>
        </section>

        <section class="reset-shell reveal">
          <section class="privacy-card reset-card">
            <div class="reset-card-header">
              <div id="reset-header" hidden>✓</div>
            </div>

            <div id="reset-status" class="reset-status" role="status" aria-live="polite" hidden>
              Validating your reset link...
            </div>

            <div id="success-container" class="success-container" hidden>
              <p id="success-message" class="success-message"></p>
              <button id="open-app-button" class="button button-primary success-button">Open the App</button>
            </div>

            <form id="reset-form" class="reset-form">
              <label class="reset-label" for="password">New password</label>
              <div class="reset-input-wrapper">
                <input
                  id="password"
                  class="reset-input"
                  name="password"
                  type="password"
                  autocomplete="new-password"
                  required
                />
                <button type="button" class="toggle-password" id="toggle-password" aria-label="Toggle password visibility">
                  �
                </button>
              </div>

              <label class="reset-label" for="confirm-password">Confirm new password</label>
              <div class="reset-input-wrapper">
                <input
                  id="confirm-password"
                  class="reset-input"
                  name="confirm-password"
                  type="password"
                  autocomplete="new-password"
                  required
                />
                <button type="button" class="toggle-password" id="toggle-confirm-password" aria-label="Toggle password visibility">
                  🙈
                </button>
              </div>

              <button id="reset-button" class="button button-primary reset-button" type="submit">
                Save new password
              </button>
            </form>
          </section>
        </section>
      </main>

      <footer class="site-footer">
        <p>SubTracko</p>
        <a href="./privacy.html">Privacy Policy</a>
      </footer>
    </div>

    <script type="module">
      import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';

      const supabaseUrl = 'https://qmyxrziikhvjodorfjcs.supabase.co';
      const supabaseAnonKey =
        'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFteXhyemlpa2h2am9kb3JmamNzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzczMDAxOTcsImV4cCI6MjA5Mjg3NjE5N30.8Xe-HDZajx-CY2LGtPA7aoRB_u5yok1z4qL3chsa2BM';

      const statusEl = document.getElementById('reset-status');
      const formEl = document.getElementById('reset-form');
      const buttonEl = document.getElementById('reset-button');
      const passwordEl = document.getElementById('password');
      const confirmPasswordEl = document.getElementById('confirm-password');
      const togglePasswordBtn = document.getElementById('toggle-password');
      const toggleConfirmPasswordBtn = document.getElementById('toggle-confirm-password');
      const resetHeaderEl = document.getElementById('reset-header');
      const successContainerEl = document.getElementById('success-container');
      const successMessageEl = document.getElementById('success-message');
      const openAppButtonEl = document.getElementById('open-app-button');

      const supabase = createClient(supabaseUrl, supabaseAnonKey);

      function togglePasswordVisibility(input, button) {
        const isPassword = input.type === 'password';
        input.type = isPassword ? 'text' : 'password';
        
        // Add animation
        button.classList.add('toggling');
        
        // Change icon: show eye when revealing, hide icon when hiding
        button.textContent = isPassword ? '👁️' : '🙈';
        
        // Remove animation class after it completes
        setTimeout(() => {
          button.classList.remove('toggling');
        }, 400);
      }

      togglePasswordBtn.addEventListener('click', (e) => {
        e.preventDefault();
        togglePasswordVisibility(passwordEl, togglePasswordBtn);
      });

      toggleConfirmPasswordBtn.addEventListener('click', (e) => {
        e.preventDefault();
        togglePasswordVisibility(confirmPasswordEl, toggleConfirmPasswordBtn);
      });

     function setStatus(message, tone = 'info', hideForm = false) {
        statusEl.textContent = message;
        statusEl.className = `reset-status reset-status-${tone}`;
        statusEl.hidden = false;
        if (hideForm) {
          formEl.hidden = true;
        }
    }

      function readParamsFromUrl() {
        const hashParams = new URLSearchParams(window.location.hash.replace(/^#/, ''));
        const searchParams = new URLSearchParams(window.location.search);

        return {
          accessToken: hashParams.get('access_token') || searchParams.get('access_token'),
          refreshToken: hashParams.get('refresh_token') || searchParams.get('refresh_token'),
          errorCode: hashParams.get('error_code') || searchParams.get('error_code'),
          errorDescription:
            hashParams.get('error_description') || searchParams.get('error_description'),
        };
      }

      async function bootstrap() {
        const { accessToken, refreshToken, errorCode, errorDescription } = readParamsFromUrl();

        // Show form initially
        formEl.hidden = false;
        statusEl.hidden = true;

        if (errorCode) {
          const decodedDescription = errorDescription
            ? decodeURIComponent(errorDescription.replace(/\+/g, ' '))
            : 'This reset link is invalid.';
          
          // Check for expired link errors
          const isExpired = decodedDescription.toLowerCase().includes('expired') || 
                           decodedDescription.toLowerCase().includes('invalid') ||
                           errorCode === 'otp_expired';
          
          if (isExpired) {
            setStatus(`${decodedDescription} Please go back to the app and request a new password reset email.`, 'error');
          } else {
            setStatus(decodedDescription, 'error');
          }
          formEl.hidden = true;
          return;
        }

        if (!accessToken || !refreshToken) {
          // Show form even without tokens - validation will happen on submit
          return;
        }

        const { error } = await supabase.auth.setSession({
          access_token: accessToken,
          refresh_token: refreshToken,
        });

        if (error) {
          const isExpired = error.message.toLowerCase().includes('expired');
          if (isExpired) {
            setStatus(`${error.message} Please go back to the app and request a new password reset email.`, 'error');
          } else {
            setStatus(error.message, 'error');
          }
          formEl.hidden = true;
          return;
        }

        // Successfully validated reset link
        statusEl.hidden = true;
      }

      formEl.addEventListener('submit', async (event) => {
        event.preventDefault();

        const password = passwordEl.value.trim();
        const confirmPassword = confirmPasswordEl.value.trim();

        if (password.length < 6) {
           setStatus('Keep a password with at least 6 characters.', 'error', false);
          return;
        }

        if (password !== confirmPassword) {
          setStatus('The passwords do not match.', 'error', false);
          return;
        }

        buttonEl.disabled = true;
        setStatus('Saving your new password...', 'info', false);
        const { error } = await supabase.auth.updateUser({ password });

       if (error) {
  if (error.message.toLowerCase().includes('same')) {
    setStatus('New password must be different from your old password.', 'error', false);
  } else {
    setStatus(error.message, 'error', false);
  }

  buttonEl.disabled = false;
  return;
}

        // Show success state
        resetHeaderEl.hidden = false;
        resetHeaderEl.classList.add('success-header');
        statusEl.hidden = true;
        formEl.hidden = true;
        successMessageEl.textContent = 'Your password has been successfully updated. Now open the app and sign in with your new password.';
        successContainerEl.hidden = false;
        buttonEl.disabled = false;

        const openAppButton = document.getElementById('open-app-button');
        openAppButton.addEventListener('click', () => {
          const isAndroid = /Android/.test(navigator.userAgent);
          const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent);

          if (isAndroid) {
            // For Android, try multiple approaches
            // First, try the Android intent scheme
            const intentUrl = 'intent://host#Intent;scheme=subtracko;package=com.shristy.subtracko;action=android.intent.action.VIEW;end';
            window.location.href = intentUrl;

            // Fallback to Play Store after 2 seconds if app doesn't open
            setTimeout(() => {
              window.location.href = 'https://play.google.com/store/apps/details?id=com.shristy.subtracko';
            }, 2000);
          } else if (isIOS) {
            // For iOS, try the app URL scheme
            window.location.href = 'subtracko://';

            // Fallback to App Store after 2 seconds if app doesn't open
            setTimeout(() => {
              window.location.href = 'https://apps.apple.com/app/subtracko/id1234567890';
            }, 2000);
          } else {
            // Fallback for web
            alert('Please open the SubTracko app on your phone. Your password has been successfully reset.');
          }
        });
      });

      bootstrap();
    </script>
  </body>
</html>
